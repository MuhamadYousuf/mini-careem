<svg viewBox="0 0 1200 830" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <!-- ======================================================================
       mini-Careem · System Architecture
       Three services, three stacks, three databases, one front door.
       Hand-drawn SVG so it renders crisply on GitHub in light & dark mode.
       ====================================================================== -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1200" height="830" rx="14" fill="#ffffff" stroke="#e9ecef"/>

  <!-- title -->
  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#212529">mini-Careem · System Architecture</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#868e96">three services · three stacks · three databases · one front door</text>

  <!-- ======================= client ======================= -->
  <rect x="480" y="96" width="240" height="58" rx="12" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="600" y="121" text-anchor="middle" font-size="16" font-weight="600" fill="#343a40">Client · Browser</text>
  <text x="600" y="141" text-anchor="middle" font-size="12" fill="#868e96">rider &amp; captain apps — one address</text>

  <!-- client -> gateway -->
  <line x1="600" y1="154" x2="600" y2="194" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="612" y="180" font-size="11.5" fill="#868e96">:8080 local · :80 prod</text>

  <!-- ======================= gateway ======================= -->
  <rect x="420" y="198" width="360" height="78" rx="12" fill="#343a40" stroke="#212529"/>
  <text x="600" y="230" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">API Gateway — Nginx</text>
  <text x="600" y="252" text-anchor="middle" font-size="12.5" fill="#ced4da">routes by URL path · the only public entry point</text>

  <!-- gateway -> wallet vm -->
  <line x1="505" y1="276" x2="218" y2="356" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="330" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#e8590c">/api/wallet</text>

  <!-- gateway -> drivers vm -->
  <line x1="600" y1="276" x2="600" y2="356" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="590" y="320" text-anchor="end" font-size="13" font-weight="600" fill="#2b8a3e">/api/drivers</text>

  <!-- gateway -> tracking vm -->
  <line x1="695" y1="276" x2="982" y2="356" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="852" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#1971c2">/api/tracking</text>

  <!-- gateway -> react ui (served as static files) -->
  <path d="M 780,237 C 1150,237 1175,420 1082,568" fill="none" stroke="#1971c2" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
  <text x="1148" y="330" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1971c2">/</text>
  <text x="1148" y="346" text-anchor="middle" font-size="11" fill="#1971c2">serves the UI</text>

  <!-- ======================= wallet vm ======================= -->
  <rect x="40" y="360" width="340" height="360" rx="14" fill="#fff9f5" stroke="#e8590c" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="58" y="386" font-size="12" font-weight="700" fill="#e8590c" letter-spacing="1">WALLET-VM · AWS LIGHTSAIL</text>

  <rect x="70" y="402" width="280" height="92" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/>
  <text x="86" y="430" font-size="15.5" font-weight="700" fill="#d9480f">Wallet Service</text>
  <text x="86" y="450" font-size="12.5" fill="#495057">Java · Spring Boot</text>
  <text x="86" y="478" font-size="12" fill="#868e96">ACID double-entry ledger — owns money</text>
  <rect x="288" y="412" width="50" height="22" rx="6" fill="#e8590c"/>
  <text x="313" y="427" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">:8081</text>

  <line x1="210" y1="494" x2="210" y2="548" stroke="#e8590c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="222" y="528" font-size="10.5" fill="#adb5bd">JPA · transactions</text>

  <!-- mysql cylinder -->
  <path d="M 125,562 v 78 a 85 13 0 0 0 170 0 v -78" fill="#e7f0fa" stroke="#1864ab" stroke-width="1.5"/>
  <ellipse cx="210" cy="562" rx="85" ry="13" fill="#d0e3f7" stroke="#1864ab" stroke-width="1.5"/>
  <text x="210" y="606" text-anchor="middle" font-size="14" font-weight="700" fill="#1864ab">MySQL 8</text>
  <text x="210" y="626" text-anchor="middle" font-size="11.5" fill="#495057">wallets &amp; ledger entries</text>
  <text x="210" y="700" text-anchor="middle" font-size="11" fill="#adb5bd" font-style="italic">nobody else may query these tables</text>

  <!-- ======================= drivers vm ======================= -->
  <rect x="430" y="360" width="340" height="360" rx="14" fill="#f6fbf7" stroke="#2b8a3e" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="448" y="386" font-size="12" font-weight="700" fill="#2b8a3e" letter-spacing="1">DRIVERS-VM · AWS LIGHTSAIL</text>

  <rect x="460" y="402" width="280" height="92" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6"/>
  <text x="476" y="430" font-size="15.5" font-weight="700" fill="#2b8a3e">Drivers Service</text>
  <text x="476" y="450" font-size="12.5" fill="#495057">Python · Django REST</text>
  <text x="476" y="478" font-size="12" fill="#868e96">flexible profiles — bike, car, rickshaw</text>
  <rect x="678" y="412" width="50" height="22" rx="6" fill="#2b8a3e"/>
  <text x="703" y="427" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">:8082</text>

  <line x1="600" y1="494" x2="600" y2="548" stroke="#2b8a3e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="612" y="528" font-size="10.5" fill="#adb5bd">mongoengine · documents</text>

  <!-- mongo cylinder -->
  <path d="M 515,562 v 78 a 85 13 0 0 0 170 0 v -78" fill="#e9f7ec" stroke="#237a34" stroke-width="1.5"/>
  <ellipse cx="600" cy="562" rx="85" ry="13" fill="#d3f0da" stroke="#237a34" stroke-width="1.5"/>
  <text x="600" y="606" text-anchor="middle" font-size="14" font-weight="700" fill="#237a34">MongoDB 6</text>
  <text x="600" y="626" text-anchor="middle" font-size="11.5" fill="#495057">driver documents</text>
  <text x="600" y="700" text-anchor="middle" font-size="11" fill="#adb5bd" font-style="italic">each profile carries its own shape</text>

  <!-- ======================= tracking vm ======================= -->
  <rect x="820" y="360" width="340" height="360" rx="14" fill="#f5faff" stroke="#1971c2" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="838" y="386" font-size="12" font-weight="700" fill="#1971c2" letter-spacing="1">TRACKING-VM · AWS LIGHTSAIL</text>

  <rect x="850" y="402" width="280" height="92" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.6"/>
  <text x="866" y="430" font-size="15.5" font-weight="700" fill="#1864ab">Tracking Service</text>
  <text x="866" y="450" font-size="12.5" fill="#495057">Node · Express</text>
  <text x="866" y="478" font-size="12" fill="#868e96">ephemeral GPS pings · 30 s TTL</text>
  <rect x="1068" y="412" width="50" height="22" rx="6" fill="#1971c2"/>
  <text x="1093" y="427" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">:8083</text>

  <line x1="925" y1="494" x2="925" y2="548" stroke="#1971c2" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- redis cylinder (narrower, shares the row with the react ui box) -->
  <path d="M 855,562 v 66 a 70 12 0 0 0 140 0 v -66" fill="#fdeeee" stroke="#c92a2a" stroke-width="1.5"/>
  <ellipse cx="925" cy="562" rx="70" ry="12" fill="#fadcdc" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="925" y="600" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c92a2a">Redis 7</text>
  <text x="925" y="618" text-anchor="middle" font-size="11" fill="#495057">RAM only · no disk</text>

  <!-- react ui box -->
  <rect x="1018" y="572" width="122" height="72" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text x="1079" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#1864ab">React UI</text>
  <text x="1079" y="618" text-anchor="middle" font-size="10.5" fill="#495057">static build</text>
  <text x="1079" y="633" text-anchor="middle" font-size="10.5" fill="#868e96">Bootstrap</text>

  <text x="990" y="700" text-anchor="middle" font-size="11" fill="#adb5bd" font-style="italic">the gateway container also lives on this VM in prod</text>

  <!-- ======================= private network band ======================= -->
  <line x1="60" y1="742" x2="1140" y2="742" stroke="#adb5bd" stroke-width="1.4" stroke-dasharray="3 5"/>
  <text x="600" y="762" text-anchor="middle" font-size="11.5" fill="#868e96">Lightsail private network — service ports :8081 · :8082 · :8083 are never public; only the gateway's :80 faces the internet</text>

  <!-- ======================= golden rule ======================= -->
  <text x="600" y="796" text-anchor="middle" font-size="13.5" font-weight="600" fill="#495057">Each service owns its database — no shared schema, no shared fate. Everything talks through the gateway's APIs.</text>
  <text x="600" y="816" text-anchor="middle" font-size="11.5" fill="#adb5bd">local: docker compose up --build → http://localhost:8080 · prod: one docker-compose per VM</text>
</svg>
