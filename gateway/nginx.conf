# mini-Careem API Gateway (Nginx).
#
# This is the ONE front door. It runs as a container on the tracking VM and is
# the only thing exposed to the internet (:80). It routes by URL path to the
# right service on the right VM's PRIVATE IP. Every service port stays on the
# private network.
#
# Replace the *.vm.internal hosts (or IPs) below with your Lightsail instances'
# PRIVATE IPs. tracking runs on THIS VM, hence 127.0.0.1.

events {}

http {
  # --- upstreams: one per service, on the private network ---
  upstream wallet   { server wallet-vm.internal:8081; }   # Java / Spring / MySQL
  upstream drivers  { server drivers-vm.internal:8082; }  # Python / Django / MongoDB
  upstream tracking { server 127.0.0.1:8083; }            # Node / Redis (same VM)

  server {
    listen 80;

    # Route by path. Each service is unaware the others exist.
    location /api/wallet/   { proxy_pass http://wallet;   }
    location /api/drivers/  { proxy_pass http://drivers;  }
    location /api/tracking/ { proxy_pass http://tracking; }

    # Everything else serves the React tracking UI (static build on this VM).
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
