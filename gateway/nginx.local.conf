# Local/all-in-one gateway config. Uses Docker Compose service names instead of
# VM private IPs, so `docker compose up` at the repo root gives you one origin
# on http://localhost:8080 that fronts all three services + the UI.

events {}

http {
  upstream wallet   { server wallet:8081; }
  upstream drivers  { server drivers:8082; }
  upstream tracking { server tracking:8083; }
  upstream web      { server web:80; }

  server {
    listen 80;

    location /api/wallet/   { proxy_pass http://wallet;   }
    location /api/drivers/  { proxy_pass http://drivers;  }
    location /api/tracking/ { proxy_pass http://tracking; }
    location /              { proxy_pass http://web;      }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
